<!DOCTYPE html>
<html lang="en">
<head>

<title>Tunnel — Page Not Found</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff7ed 0%,#fff 50%,#fef3c7 100%);color:#1d2939}

  h2{font-size:18px;font-weight:600;margin-bottom:12px}
  p{font-size:14px;color:#667085;line-height:1.6;margin-bottom:24px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:10px;background:linear-gradient(135deg,#ff6b00,#ff8c40);color:#fff;font-size:14px;font-weight:600;text-decoration:none;border:none;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(255,107,0,.3)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,107,0,.4)}
</style>
</head>
<body>

  </div>
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>The page you're looking for doesn't exist or has been moved. Head back to your learning dashboard.</p>
  <a href="/" class="btn">← Back to Tunnel</a>
</div>

</html>
